description: You're offline. Reconnect to continue your visit.
nav: none

<section class="err">
  <div class="wrap err-grid">
    <div class="err-art">{{pot:Wifi ?}}</div>
    <div>
      <p class="err-code">Offline</p>
      <h1>No network… <span class="script">but no panic</span></h1>
      <p class="lead">You seem to be offline. Pages you've already visited are still available, and this page will reload by itself as soon as the network is back.</p>
      <div class="btn-row"><button class="btn btn--red" type="button" data-reload>↻ Try again</button></div>
    </div>
  </div>
</section>
