# Construit le site (python build.py) à chaque push sur main et le publie :
#   1) dans la branche « gh-pages » (réglage GitHub : Settings > Pages > Deploy from a branch > gh-pages / root)
#   2) directement sur GitHub Pages si le réglage est « GitHub Actions »
# Les deux modes fonctionnent : il suffit de choisir l'un des deux dans Settings > Pages.
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:            # après la mise à jour mensuelle des notes Google
    workflows: ["Notes Google"]
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Dépendances
        run: pip install pillow

      - name: Construction du site
        # Sur <utilisateur>.github.io/<dépôt>/, le site vit dans un sous-dossier.
        # Avec un domaine personnalisé (ex. yogurtfactory.fr), mettre BASE_PATH à "".
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: python build.py

      - name: Publication dans la branche gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Site généré depuis"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Utilisé seulement si Settings > Pages > Source = « GitHub Actions »
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
